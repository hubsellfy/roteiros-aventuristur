name: Imagem Roteiros Aventuristur

# Builds the container image for app.aventuristur.com and publishes it to GHCR.
# Every image carries the commit it was built from (Settings > About links to it,
# AGPL-3.0 §13). Com o segredo EASYPANEL_DEPLOY_URL definido, cada imagem publicada
# na main aciona o deploy do serviço no Easypanel (que usa a tag :main).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/aventuristur-imagem.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hubsellfy/roteiros-aventuristur

jobs:
  build:
    name: Construir e publicar imagem
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Entrar no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ler a versão do app
        id: versao
        run: echo "valor=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Construir (e publicar fora de PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.versao.outputs.valor }}
            APP_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Acionar o deploy no Easypanel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "EASYPANEL_DEPLOY_URL não definido: deploy automático desligado."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$EASYPANEL_DEPLOY_URL"
          echo "Deploy acionado para a imagem sha-${GITHUB_SHA}."
